services:
  backend:
    build: ./server
    container_name: backend
    env_file:
      - ./server/.env
    ports:
      - "5050:5050"
    depends_on:
      - mongodb
  mongodb:
    image: mongo:8
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - C:/Users/User/Desktop/Docker-Volume:/data/db

  frontend:
    build: ./client
    container_name: frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend