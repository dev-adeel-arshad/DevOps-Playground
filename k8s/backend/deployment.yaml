apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devops-playground

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: adeelarshad01/mern-backend:latest

          ports:
            - containerPort: 5050

          livenessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                 name: backend-secret
                 
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"